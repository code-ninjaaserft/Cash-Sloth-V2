name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build-test:
    # The native core still targets the Visual Studio 2022 CMake generator.
    # windows-latest now points at the VS 2026 image, so keep this runner explicit.
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Cache NuGet
        uses: actions/cache@v5
        with:
          path: |
            ~\AppData\Local\NuGet\Cache
            ~\AppData\Local\NuGet\v3-cache
            ~\.nuget\packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', '**/nuget.config') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Configure CMake (Core)
        run: |
          cmake -S . -B build/core -G "Visual Studio 17 2022" -A x64

      - name: Build Core (Release)
        run: |
          cmake --build build/core --config Release

      - name: Run C++ tests (if present)
        shell: pwsh
        run: |
          if (Test-Path "build/core") {
            ctest --test-dir build/core -C Release --output-on-failure
          } else {
            Write-Host "No build/core directory; skipping ctest."
          }

      - name: Restore .NET solution
        run: |
          dotnet restore CashSloth.sln

      - name: Build and test .NET solution
        run: |
          dotnet test CashSloth.sln -c Release --no-restore -p:SkipNativeCoreBuild=true
